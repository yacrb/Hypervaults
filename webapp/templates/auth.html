<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>HyperVaults · Sign in</title>
  <link rel="icon" href="/static/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=4">
  <script type="module" src="/static/js/auth.js?v=6"></script>
</head>
<body class="auth-body">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="auth-header">
    <a class="brand" href="/login"><img src="/static/favicon.svg?v=2" alt="" width="32" height="32">HyperVaults</a>
    <span class="environment"><span class="status-dot"></span>Anvil</span>
  </header>
  <main id="main" class="auth-layout">
    <section class="auth-intro" aria-labelledby="intro-title">
      <h1 id="intro-title">Your tokens.<br><span>Your terms.</span></h1>
      <p>Lock tokens. Earn rewards.</p>
      <div class="vault-art" aria-hidden="true"><img src="/static/vault.svg" alt="" width="420" height="300"></div>
    </section>
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-card-heading"><span class="auth-symbol"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#vault"></use></svg></span><h2 id="auth-title">Welcome back</h2><p id="auth-description" class="muted" hidden></p></div>
      <div id="wallet-auth">
        <button id="siwe-login" class="button wallet-login full-width" type="button" disabled><span class="wallet-logos" aria-hidden="true"><img src="/static/wallets/metamask.svg" alt="" width="22" height="22"><img src="/static/wallets/rabby.svg" alt="" width="22" height="22"></span><span id="wallet-login-label">Continue with wallet</span><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#arrow-right"></use></svg></button>
        <div class="divider"><span>or email</span></div>
      </div>
      <form id="auth-form" class="form-stack" method="post">
        <label id="email-label">Email<input name="email" type="email" placeholder="you@example.com" autocomplete="username" maxlength="254" required></label>
        <label id="name-label" hidden>Display name<input name="name" placeholder="Your name" autocomplete="nickname" maxlength="60"></label>
        <label id="password-label">Password<span class="password-field"><input name="password" type="password" placeholder="Enter your password" autocomplete="current-password" maxlength="128" required><button id="show-password" class="icon-button" type="button" aria-label="Show password" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#eye"></use></svg></button></span></label>
        <label id="confirm-label" hidden>Confirm password<input name="confirm" type="password" autocomplete="new-password" maxlength="128"></label>
        <p id="password-hint" class="muted form-hint" hidden>Use 12 or more characters.</p>
        <a id="recovery-link" class="text-link recovery-link" href="/recover">Forgot password?</a>
        <button id="auth-submit" class="button full-width" type="submit" disabled>Sign in</button>
        <p id="auth-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <div id="auth-links" class="auth-links"><a class="text-link" href="/register">Create an account <span aria-hidden="true">↗</span></a></div>
    </section>
  </main>
</body>
</html>
