<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="setup-token" content="SETUP_TOKEN"><meta name="color-scheme" content="dark">
  <title>HyperVaults · Sepolia setup</title>
  <link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/setup.js"></script>
</head>
<body class="auth-body">
  <header class="auth-header"><a class="brand" href="/"><img src="/static/favicon.svg" width="32" height="32" alt="">HyperVaults</a><span class="environment">Sepolia</span></header>
  <main id="main" class="auth-layout">
    <section class="auth-intro"><h1>Ready for<br><span>Sepolia.</span></h1><p>Approve each step in your wallet.</p></section>
    <section class="auth-card" aria-labelledby="setup-title">
      <h2 id="setup-title">Set up your vault</h2>
      <p id="owner" class="mono wrap-address"></p>
      <ol id="steps" aria-label="Confirmed deployment steps"></ol>
      <div class="form-stack">
        <p id="status" class="form-message" role="status" aria-live="polite">Checking Sepolia…</p>
        <p id="cost" class="muted form-hint"></p>
        <button id="continue" class="button full-width" type="button" disabled>Connect wallet</button>
        <button id="retry" class="button button-secondary full-width" type="button" hidden>Check again</button>
        <a id="open-app" class="button full-width" href="http://127.0.0.1:8088/login" hidden>Open HyperVaults</a>
      </div>
    </section>
  </main>
</body>
</html>
