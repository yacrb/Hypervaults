[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
chain_id = 31337
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  # Retain this compiler metadata setting to verify existing local deployments.
  "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
