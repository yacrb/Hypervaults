<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" style="font-family:Arial,sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7654C4"/></marker></defs><rect width="1200" height="100%" rx="26" fill="#FBFAFF"/><text x="36" y="43" fill="#231B36" font-size="27" font-weight="700">The security controls we implemented</text><text x="36" y="73" fill="#70677D" font-size="18" font-weight="400">Each step closes a concrete failure path and has a matching test.</text><g data-card="true" data-x="40" data-y="125" data-width="350" data-height="136"><rect x="40" y="129" width="350" height="136" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="40" y="125" width="350" height="136" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(58,142) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="16" rx="3"/><path d="M3 5V3h15M16 11h6v6h-6Z"/></g></g><text x="105" y="166" fill="#231B36" font-size="22.0" font-weight="700">1  Define boundaries</text><text x="59" y="193" fill="#70677D" font-size="18">Account access vs wallet authority</text><text x="59" y="217" fill="#70677D" font-size="18">Keep private keys out of the API</text></g><g data-card="true" data-x="430" data-y="125" data-width="350" data-height="136"><rect x="430" y="129" width="350" height="136" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="430" y="125" width="350" height="136" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(448,142) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></g></g><text x="495" y="166" fill="#231B36" font-size="22.0" font-weight="700">2  Verify identities</text><text x="449" y="193" fill="#70677D" font-size="18">Argon2id passwords + SIWE proofs</text><text x="449" y="217" fill="#70677D" font-size="18">Rate limits and strict input shapes</text></g><g data-card="true" data-x="820" data-y="125" data-width="350" data-height="136"><rect x="820" y="129" width="350" height="136" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="820" y="125" width="350" height="136" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(838,142) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 3"/></g></g><text x="885" y="166" fill="#231B36" font-size="22.0" font-weight="700">3  Control sessions</text><text x="839" y="193" fill="#70677D" font-size="18">Opaque tokens, rotation and expiry</text><text x="839" y="217" fill="#70677D" font-size="18">Origin + CSRF on mutations</text></g><g data-card="true" data-x="40" data-y="299" data-width="350" data-height="136"><rect x="40" y="303" width="350" height="136" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="40" y="299" width="350" height="136" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(58,316) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 6 9 10 9 10s9-4 9-10V6Z"/><path d="m8 12 3 3 5-6"/></g></g><text x="105" y="340" fill="#231B36" font-size="22.0" font-weight="700">4  Enforce permissions</text><text x="59" y="367" fill="#70677D" font-size="18">Current roles and wallet ownership</text><text x="59" y="391" fill="#70677D" font-size="18">Invalidate access after changes</text></g><g data-card="true" data-x="430" data-y="299" data-width="350" data-height="136"><rect x="430" y="303" width="350" height="136" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="430" y="299" width="350" height="136" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(448,316) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5"/><path d="m12 12 9 9M16 16l3-3M18 18l3-3"/></g></g><text x="495" y="340" fill="#231B36" font-size="22.0" font-weight="700">5  Protect stored data</text><text x="449" y="367" fill="#70677D" font-size="18">AES-256-GCM + bound context</text><text x="449" y="391" fill="#70677D" font-size="18">Reserve nonces and retain key IDs</text></g><g data-card="true" data-x="820" data-y="299" data-width="350" data-height="136"><rect x="820" y="303" width="350" height="136" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="820" y="299" width="350" height="136" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(838,316) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2h7v7H2ZM15 2h7v7h-7ZM2 15h7v7H2ZM15 15h3v3h-3ZM21 14v8h-7M11 2v10H2M12 16v6M17 11h5"/></g></g><text x="885" y="340" fill="#231B36" font-size="22.0" font-weight="700">6  Add verified MFA</text><text x="839" y="367" fill="#70677D" font-size="18">QR enrollment + one-use factors</text><text x="839" y="391" fill="#70677D" font-size="18">No login/recovery bypass</text></g><g data-card="true" data-x="40" data-y="473" data-width="350" data-height="136"><rect x="40" y="477" width="350" height="136" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="40" y="473" width="350" height="136" rx="16" fill="#ECE5FB" stroke="#D8CBEA"/><g transform="translate(58,490) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m6 12 4 4 8-9"/></g></g><text x="105" y="514" fill="#231B36" font-size="22.0" font-weight="700">7  Verify the system</text><text x="59" y="541" fill="#70677D" font-size="18">API misuse + browser + contracts</text><text x="59" y="565" fill="#70677D" font-size="18">Record evidence and remaining gaps</text></g></svg>