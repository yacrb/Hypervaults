<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" style="font-family:Arial,sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7654C4"/></marker></defs><rect width="1200" height="100%" rx="26" fill="#FBFAFF"/><text x="36" y="43" fill="#231B36" font-size="27" font-weight="700">MFA enrollment is a verified transition</text><text x="36" y="73" fill="#70677D" font-size="18" font-weight="400">A displayed QR never enables MFA by itself.</text><path d="M 370,200 L 430,200" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 765,200 L 825,200" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 997,273 L 997,365" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 997,315 L 298,315 L 298,365" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><g data-card="true" data-x="35" data-y="123" data-width="335" data-height="150"><rect x="35" y="127" width="335" height="150" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="35" y="123" width="335" height="150" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(53,140) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></g></g><text x="100" y="164" fill="#231B36" font-size="22.0" font-weight="700">Confirm identity</text><text x="54" y="191" fill="#70677D" font-size="18">Password or linked-wallet proof</text><text x="54" y="215" fill="#70677D" font-size="18">Recent identity window: 5 minutes</text><text x="54" y="239" fill="#70677D" font-size="18">Setup bound to browser and account</text></g><g data-card="true" data-x="430" data-y="123" data-width="335" data-height="150"><rect x="430" y="127" width="335" height="150" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="430" y="123" width="335" height="150" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(448,140) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2h7v7H2ZM15 2h7v7h-7ZM2 15h7v7H2ZM15 15h3v3h-3ZM21 14v8h-7M11 2v10H2M12 16v6M17 11h5"/></g></g><text x="495" y="164" fill="#231B36" font-size="22.0" font-weight="700">Create enrollment</text><text x="449" y="191" fill="#70677D" font-size="18">Generate a random 160-bit secret</text><text x="449" y="215" fill="#70677D" font-size="18">Encrypt it with purpose-bound GCM</text><text x="449" y="239" fill="#70677D" font-size="18">Generate QR locally from otpauth URI</text></g><g data-card="true" data-x="825" data-y="123" data-width="335" data-height="150"><rect x="825" y="127" width="335" height="150" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="825" y="123" width="335" height="150" rx="16" fill="#ECE5FB" stroke="#D8CBEA"/><g transform="translate(843,140) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m6 12 4 4 8-9"/></g></g><text x="890" y="164" fill="#231B36" font-size="22.0" font-weight="700">Scan and verify</text><text x="844" y="191" fill="#70677D" font-size="18">Authenticator imports the QR</text><text x="844" y="215" fill="#70677D" font-size="18">User supplies a six-digit TOTP</text><text x="844" y="239" fill="#70677D" font-size="18">Only a valid code enables MFA</text></g><g data-card="true" data-x="40" data-y="365" data-width="515" data-height="124"><rect x="40" y="369" width="515" height="124" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="40" y="365" width="515" height="124" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(58,382) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="3"/><path d="M7 10V7a5 5 0 0 1 10 0v3M12 15v3"/></g></g><text x="105" y="406" fill="#231B36" font-size="22.0" font-weight="700">Protect authenticator state</text><text x="59" y="433" fill="#70677D" font-size="18">TOTP: HMAC-SHA1, six digits, 30-second steps</text><text x="59" y="457" fill="#70677D" font-size="18">Accepted time steps are atomically one-use.</text><text x="59" y="481" fill="#70677D" font-size="18">Secret remains encrypted in the account record.</text></g><g data-card="true" data-x="645" data-y="365" data-width="515" data-height="124"><rect x="645" y="369" width="515" height="124" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="645" y="365" width="515" height="124" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(663,382) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5"/><path d="m12 12 9 9M16 16l3-3M18 18l3-3"/></g></g><text x="710" y="406" fill="#231B36" font-size="22.0" font-weight="700">Save eight recovery codes</text><text x="664" y="433" fill="#70677D" font-size="18">Each code contains 128 random bits</text><text x="664" y="457" fill="#70677D" font-size="18">Only SHA-256 hashes are stored</text><text x="664" y="481" fill="#70677D" font-size="18">Atomic removal makes each code single-use.</text></g></svg>