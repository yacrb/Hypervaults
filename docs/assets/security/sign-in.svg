<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" style="font-family:Arial,sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7654C4"/></marker></defs><rect width="1200" height="100%" rx="26" fill="#FBFAFF"/><text x="36" y="43" fill="#231B36" font-size="27" font-weight="700">One sign-in gate for both methods</text><text x="36" y="73" fill="#70677D" font-size="18" font-weight="400">A correct first factor alone grants no access when MFA is enabled.</text><path d="M 305,185 L 330,185 L 330,234 L 360,234" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 305,338 L 330,338 L 330,275 L 360,275" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 610,245 L 655,245" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 890,218 L 913,218 L 913,180 L 930,180" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="892" y="129" width="34" height="29" rx="7" fill="#FBFAFF"/><text x="899" y="150" fill="#7654C4" font-size="17" font-weight="600">No</text><path d="M 773,289 L 773,360" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="777" y="309" width="43" height="29" rx="7" fill="#FBFAFF"/><text x="784" y="330" fill="#7654C4" font-size="17" font-weight="600">Yes</text><path d="M 890,420 L 930,420" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 1045,360 L 1045,241" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="1050" y="281" width="61" height="29" rx="7" fill="#FBFAFF"/><text x="1057" y="302" fill="#7654C4" font-size="17" font-weight="600">Valid</text><path d="M 1165,175 L 1183,175 L 1183,606 L 1165,606" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><g data-card="true" data-x="35" data-y="126" data-width="270" data-height="112"><rect x="35" y="130" width="270" height="112" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="35" y="126" width="270" height="112" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(53,143) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></g></g><text x="100" y="167" fill="#231B36" font-size="22.0" font-weight="700">Email sign-in</text><text x="54" y="194" fill="#70677D" font-size="18">Validate input and rate limit</text><text x="54" y="218" fill="#70677D" font-size="18">Verify Argon2id password</text></g><g data-card="true" data-x="35" data-y="282" data-width="270" data-height="126"><rect x="35" y="286" width="270" height="126" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="35" y="282" width="270" height="126" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(53,299) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="16" rx="3"/><path d="M3 5V3h15M16 11h6v6h-6Z"/></g></g><text x="100" y="323" fill="#231B36" font-size="22.0" font-weight="700">Wallet sign-in</text><text x="54" y="350" fill="#70677D" font-size="18">Verify signed SIWE challenge</text><text x="54" y="374" fill="#70677D" font-size="18">Domain, chain, nonce, expiry</text><text x="54" y="398" fill="#70677D" font-size="18">Consume the proof once</text></g><g data-card="true" data-x="360" data-y="192" data-width="250" data-height="126"><rect x="360" y="196" width="250" height="126" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="360" y="192" width="250" height="126" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(378,209) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 6 9 10 9 10s9-4 9-10V6Z"/><path d="m8 12 3 3 5-6"/></g></g><text x="425" y="233" fill="#231B36" font-size="22.0" font-weight="700">Primary proof</text><text x="379" y="260" fill="#70677D" font-size="18">Resolve the account</text><text x="379" y="284" fill="#70677D" font-size="18">Refuse a disabled identity</text><text x="379" y="308" fill="#70677D" font-size="18">Read current auth_version</text></g><g data-card="true" data-x="655" data-y="190" data-width="235" data-height="99"><rect x="655" y="194" width="235" height="99" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="655" y="190" width="235" height="99" rx="16" fill="#ECE5FB" stroke="#D8CBEA"/><g transform="translate(673,207) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="3"/><path d="M7 10V7a5 5 0 0 1 10 0v3M12 15v3"/></g></g><text x="720" y="231" fill="#231B36" font-size="22.0" font-weight="700">MFA enabled?</text><text x="674" y="258" fill="#70677D" font-size="18">Server decides</text></g><g data-card="true" data-x="930" data-y="115" data-width="235" data-height="126"><rect x="930" y="119" width="235" height="126" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="930" y="115" width="235" height="126" rx="16" fill="#ECE5FB" stroke="#D8CBEA"/><g transform="translate(948,132) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m6 12 4 4 8-9"/></g></g><text x="995" y="156" fill="#231B36" font-size="22.0" font-weight="700">Full session</text><text x="949" y="183" fill="#70677D" font-size="18">Fresh opaque cookie</text><text x="949" y="207" fill="#70677D" font-size="18">Fresh CSRF token</text><text x="949" y="231" fill="#70677D" font-size="18">Account access unlocked</text></g><g data-card="true" data-x="655" data-y="360" data-width="235" data-height="127"><rect x="655" y="364" width="235" height="127" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="655" y="360" width="235" height="127" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(673,377) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 3"/></g></g><text x="720" y="401" fill="#231B36" font-size="18.6" font-weight="700">Pending session</text><text x="674" y="428" fill="#70677D" font-size="18">Anonymous; no access</text><text x="674" y="452" fill="#70677D" font-size="18">Browser + user version</text><text x="674" y="476" fill="#70677D" font-size="18">Five-minute expiry</text></g><g data-card="true" data-x="930" data-y="360" data-width="235" data-height="127"><rect x="930" y="364" width="235" height="127" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="930" y="360" width="235" height="127" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(948,377) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2h7v7H2ZM15 2h7v7h-7ZM2 15h7v7H2ZM15 15h3v3h-3ZM21 14v8h-7M11 2v10H2M12 16v6M17 11h5"/></g></g><text x="995" y="401" fill="#231B36" font-size="21.5" font-weight="700">Second factor</text><text x="949" y="428" fill="#70677D" font-size="18">TOTP or recovery code</text><text x="949" y="452" fill="#70677D" font-size="18">Consume factor once</text><text x="949" y="476" fill="#70677D" font-size="18">Refuse invalid codes</text></g><g data-card="true" data-x="660" data-y="560" data-width="505" data-height="90"><rect x="660" y="564" width="505" height="90" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="660" y="560" width="505" height="90" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(678,577) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 6 9 10 9 10s9-4 9-10V6Z"/><path d="m8 12 3 3 5-6"/></g></g><text x="725" y="601" fill="#231B36" font-size="22.0" font-weight="700">Protected API access</text><text x="679" y="628" fill="#70677D" font-size="18">Check status, role and session lifetime on every request.</text></g></svg>