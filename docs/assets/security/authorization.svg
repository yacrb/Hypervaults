<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" style="font-family:Arial,sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7654C4"/></marker></defs><rect width="1200" height="100%" rx="26" fill="#FBFAFF"/><text x="36" y="43" fill="#231B36" font-size="27" font-weight="700">Authorization has three independent layers</text><text x="36" y="73" fill="#70677D" font-size="18" font-weight="400">A website administrator cannot seize a user&#x27;s on-chain position.</text><text x="40" y="425" fill="#7654C4" font-size="20" font-weight="700">UI visibility helps navigation; server dependencies and Solidity checks enforce permissions.</text><g data-card="true" data-x="35" data-y="124" data-width="345" data-height="238"><rect x="35" y="128" width="345" height="238" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="35" y="124" width="345" height="238" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(53,141) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></g></g><text x="100" y="165" fill="#231B36" font-size="22.0" font-weight="700">Website member</text><text x="54" y="192" fill="#70677D" font-size="18">Manage own account and sessions</text><text x="54" y="216" fill="#70677D" font-size="18">Read only linked-wallet positions</text><text x="54" y="240" fill="#70677D" font-size="18">Encrypt/decrypt owned notes</text><text x="54" y="264" fill="#70677D" font-size="18">Admin APIs return 403</text><text x="54" y="288" fill="#70677D" font-size="18">Pending MFA returns 401</text></g><g data-card="true" data-x="430" data-y="124" data-width="345" data-height="238"><rect x="430" y="128" width="345" height="238" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="430" y="124" width="345" height="238" rx="16" fill="#ECE5FB" stroke="#D8CBEA"/><g transform="translate(448,141) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 6 9 10 9 10s9-4 9-10V6Z"/><path d="m8 12 3 3 5-6"/></g></g><text x="495" y="165" fill="#231B36" font-size="22.0" font-weight="700">Website administrator</text><text x="449" y="192" fill="#70677D" font-size="18">Manage website roles and status</text><text x="449" y="216" fill="#70677D" font-size="18">Revoke affected sessions</text><text x="449" y="240" fill="#70677D" font-size="18">Admin APIs check current role</text><text x="449" y="264" fill="#70677D" font-size="18">Cannot disable/demote itself</text><text x="449" y="288" fill="#70677D" font-size="18">Has no user&#x27;s wallet key</text></g><g data-card="true" data-x="825" data-y="124" data-width="340" data-height="238"><rect x="825" y="128" width="340" height="238" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="825" y="124" width="340" height="238" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(843,141) scale(1.35)"><g fill="#7654C4"><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M11.944 17.97L4.58 13.62 11.943 24l7.37-10.38-7.372 4.35h.003zM12.056 0L4.69 12.223l7.365 4.354 7.365-4.35L12.056 0z" /></g></g><text x="890" y="165" fill="#231B36" font-size="19.0" font-weight="700">Contract wallet authority</text><text x="844" y="192" fill="#70677D" font-size="18">Owner may change future offers</text><text x="844" y="216" fill="#70677D" font-size="18">Owner may pause new deposits</text><text x="844" y="240" fill="#70677D" font-size="18">Position owner alone withdraws</text><text x="844" y="264" fill="#70677D" font-size="18">Maturity is enforced on-chain</text><text x="844" y="288" fill="#70677D" font-size="18">No sweep / seizure function</text></g></svg>