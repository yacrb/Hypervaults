<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" style="font-family:Arial,sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7654C4"/></marker></defs><rect width="1200" height="100%" rx="26" fill="#FBFAFF"/><text x="36" y="43" fill="#231B36" font-size="27" font-weight="700">Session lifecycle and revocation</text><text x="36" y="73" fill="#70677D" font-size="18" font-weight="400">MFA-enabled sign-in rotates identifiers twice; the browser never stores a JWT.</text><text x="42" y="565" fill="#70677D" font-size="19" font-weight="400">Defaults: 30-minute idle lifetime / 8-hour absolute lifetime / 5-minute recent identity proof.</text><path d="M 290,194 L 325,194" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 580,194 L 615,194" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 870,194 L 905,194" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 1030,256 L 1030,303 L 300,303 L 300,350" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 650,450 L 560,450" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="563" y="401" width="70" height="29" rx="7" fill="#FBFAFF"/><text x="570" y="422" fill="#7654C4" font-size="17" font-weight="600">Revoke</text><g data-card="true" data-x="35" data-y="130" data-width="255" data-height="126"><rect x="35" y="134" width="255" height="126" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="35" y="130" width="255" height="126" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(53,147) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></g></g><text x="100" y="171" fill="#231B36" font-size="22.0" font-weight="700">Anonymous</text><text x="54" y="198" fill="#70677D" font-size="18">Bootstrap cookie + CSRF</text><text x="54" y="222" fill="#70677D" font-size="18">No user permissions</text></g><g data-card="true" data-x="325" data-y="130" data-width="255" data-height="126"><rect x="325" y="134" width="255" height="126" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="325" y="130" width="255" height="126" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(343,147) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="3"/><path d="M7 10V7a5 5 0 0 1 10 0v3M12 15v3"/></g></g><text x="390" y="171" fill="#231B36" font-size="19.8" font-weight="700">Primary verified</text><text x="344" y="198" fill="#70677D" font-size="18">Rotate to pending MFA</text><text x="344" y="222" fill="#70677D" font-size="18">Still anonymous</text></g><g data-card="true" data-x="615" data-y="130" data-width="255" data-height="126"><rect x="615" y="134" width="255" height="126" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="615" y="130" width="255" height="126" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(633,147) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2h7v7H2ZM15 2h7v7h-7ZM2 15h7v7H2ZM15 15h3v3h-3ZM21 14v8h-7M11 2v10H2M12 16v6M17 11h5"/></g></g><text x="680" y="171" fill="#231B36" font-size="21.1" font-weight="700">Factor verified</text><text x="634" y="198" fill="#70677D" font-size="18">Consume factor atomically</text><text x="634" y="222" fill="#70677D" font-size="18">Rotate cookie + CSRF</text></g><g data-card="true" data-x="905" data-y="130" data-width="255" data-height="126"><rect x="905" y="134" width="255" height="126" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="905" y="130" width="255" height="126" rx="16" fill="#ECE5FB" stroke="#D8CBEA"/><g transform="translate(923,147) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m6 12 4 4 8-9"/></g></g><text x="970" y="171" fill="#231B36" font-size="22.0" font-weight="700">Authenticated</text><text x="924" y="198" fill="#70677D" font-size="18">Hash stored server-side</text><text x="924" y="222" fill="#70677D" font-size="18">HttpOnly browser cookie</text></g><g data-card="true" data-x="40" data-y="350" data-width="520" data-height="170"><rect x="40" y="354" width="520" height="170" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="40" y="350" width="520" height="170" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(58,367) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 6h1M6 17h1M11 6h7M11 17h7"/></g></g><text x="105" y="391" fill="#231B36" font-size="20.2" font-weight="700">Each request resolves live account state</text><text x="59" y="418" fill="#70677D" font-size="18">Reject expired idle or absolute lifetimes</text><text x="59" y="442" fill="#70677D" font-size="18">Reject disabled / missing accounts</text><text x="59" y="466" fill="#70677D" font-size="18">Reject auth_version mismatch</text><text x="59" y="490" fill="#70677D" font-size="18">Evaluate the current role for admin APIs</text></g><g data-card="true" data-x="650" data-y="350" data-width="510" data-height="170"><rect x="650" y="354" width="510" height="170" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="650" y="350" width="510" height="170" rx="16" fill="#ECE5FB" stroke="#D8CBEA"/><g transform="translate(668,367) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 6 9 10 9 10s9-4 9-10V6Z"/><path d="m8 12 3 3 5-6"/></g></g><text x="715" y="391" fill="#231B36" font-size="22.0" font-weight="700">Sensitive account changes</text><text x="669" y="418" fill="#70677D" font-size="18">Password, MFA, linkage or admin updates</text><text x="669" y="442" fill="#70677D" font-size="18">Increment the authorization version</text><text x="669" y="466" fill="#70677D" font-size="18">Revoke affected sessions and tokens</text><text x="669" y="490" fill="#70677D" font-size="18">Keep only the authorized browser when applicable</text></g></svg>