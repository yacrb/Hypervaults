<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" style="font-family:Arial,sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7654C4"/></marker></defs><rect width="1200" height="100%" rx="26" fill="#FBFAFF"/><text x="36" y="43" fill="#231B36" font-size="27" font-weight="700">Connect then link then use</text><text x="36" y="73" fill="#70677D" font-size="18" font-weight="400">Connecting exposes an address; only an ownership signature binds it to an account.</text><text x="40" y="352" fill="#7654C4" font-size="20" font-weight="700">SIWE binds domain + URI + chain + nonce + action + time window + selected wallet.</text><path d="M 370,210 L 430,210" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 765,210 L 825,210" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><g data-card="true" data-x="35" data-y="132" data-width="335" data-height="170"><rect x="35" y="136" width="335" height="170" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="35" y="132" width="335" height="170" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(53,149) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="16" rx="3"/><path d="M3 5V3h15M16 11h6v6h-6Z"/></g></g><text x="100" y="173" fill="#231B36" font-size="22.0" font-weight="700">1  Connect</text><text x="54" y="200" fill="#70677D" font-size="18">Discover available injected wallets</text><text x="54" y="224" fill="#70677D" font-size="18">Select the configured network</text><text x="54" y="248" fill="#70677D" font-size="18">Read the selected public address</text><text x="54" y="272" fill="#70677D" font-size="18">No website identity change</text></g><g data-card="true" data-x="430" data-y="132" data-width="335" data-height="170"><rect x="430" y="136" width="335" height="170" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="430" y="132" width="335" height="170" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(448,149) scale(1.35)"><g fill="#7654C4"><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M11.944 17.97L4.58 13.62 11.943 24l7.37-10.38-7.372 4.35h.003zM12.056 0L4.69 12.223l7.365 4.354 7.365-4.35L12.056 0z" /></g></g><text x="495" y="173" fill="#231B36" font-size="22.0" font-weight="700">2  Sign a link proof</text><text x="449" y="200" fill="#70677D" font-size="18">Require recent website identity</text><text x="449" y="224" fill="#70677D" font-size="18">Issue a five-minute SIWE message</text><text x="449" y="248" fill="#70677D" font-size="18">Bind action, browser and account</text><text x="449" y="272" fill="#70677D" font-size="18">No token transfer is authorized</text></g><g data-card="true" data-x="825" data-y="132" data-width="335" data-height="170"><rect x="825" y="136" width="335" height="170" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="825" y="132" width="335" height="170" rx="16" fill="#ECE5FB" stroke="#D8CBEA"/><g transform="translate(843,149) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 6 9 10 9 10s9-4 9-10V6Z"/><path d="m8 12 3 3 5-6"/></g></g><text x="890" y="173" fill="#231B36" font-size="22.0" font-weight="700">3  Link on the server</text><text x="844" y="200" fill="#70677D" font-size="18">Verify signer and exact message</text><text x="844" y="224" fill="#70677D" font-size="18">Consume the challenge once</text><text x="844" y="248" fill="#70677D" font-size="18">Enforce a unique wallet owner</text><text x="844" y="272" fill="#70677D" font-size="18">Rotate access after linkage</text></g><g data-card="true" data-x="40" data-y="398" data-width="515" data-height="118"><rect x="40" y="402" width="515" height="118" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="40" y="398" width="515" height="118" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(58,415) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></g></g><text x="105" y="439" fill="#231B36" font-size="22.0" font-weight="700">Email-first account</text><text x="59" y="466" fill="#70677D" font-size="18">Email for access; linked wallet for transactions.</text><text x="59" y="490" fill="#70677D" font-size="18">Both sign-in methods share one account.</text></g><g data-card="true" data-x="645" data-y="398" data-width="515" data-height="118"><rect x="645" y="402" width="515" height="118" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="645" y="398" width="515" height="118" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(663,415) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="3"/><path d="M7 10V7a5 5 0 0 1 10 0v3M12 15v3"/></g></g><text x="710" y="439" fill="#231B36" font-size="22.0" font-weight="700">Wallet-first account</text><text x="664" y="466" fill="#70677D" font-size="18">Recent wallet proof authorizes adding email + password.</text><text x="664" y="490" fill="#70677D" font-size="18">Enabled MFA also applies to that identity confirmation.</text></g></svg>