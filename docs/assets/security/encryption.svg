<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" style="font-family:Arial,sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7654C4"/></marker></defs><rect width="1200" height="100%" rx="26" fill="#FBFAFF"/><text x="36" y="43" fill="#231B36" font-size="27" font-weight="700">Encryption with authenticated context</text><text x="36" y="73" fill="#70677D" font-size="18" font-weight="400">A valid key is not enough: the account, record and purpose must also match.</text><path d="M 325,323 L 420,323" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 720,323 L 825,323" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 570,215 L 570,275" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 300,482 L 300,429 L 520,429 L 520,387" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/><path d="M 999,398 L 999,482" fill="none" stroke="#7654C4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" /><g data-card="true" data-x="390" data-y="115" data-width="360" data-height="100"><rect x="390" y="119" width="360" height="100" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="390" y="115" width="360" height="100" rx="16" fill="#ECE5FB" stroke="#D8CBEA"/><g transform="translate(408,132) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5"/><path d="m12 12 9 9M16 16l3-3M18 18l3-3"/></g></g><text x="455" y="156" fill="#231B36" font-size="22.0" font-weight="700">External AES key ring</text><text x="409" y="183" fill="#70677D" font-size="18">32-byte keys and an active key ID</text><text x="409" y="207" fill="#70677D" font-size="18">Retain old keys while records use them</text></g><g data-card="true" data-x="35" data-y="260" data-width="290" data-height="124"><rect x="35" y="264" width="290" height="124" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="35" y="260" width="290" height="124" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(53,277) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="3"/><path d="M7 10V7a5 5 0 0 1 10 0v3M12 15v3"/></g></g><text x="100" y="301" fill="#231B36" font-size="19.1" font-weight="700">Authorized plaintext</text><text x="54" y="328" fill="#70677D" font-size="18">Private note or MFA secret</text><text x="54" y="352" fill="#70677D" font-size="18">Owner access checked first</text><text x="54" y="376" fill="#70677D" font-size="18">Fresh 12-byte nonce reserved</text></g><g data-card="true" data-x="420" data-y="275" data-width="300" data-height="112"><rect x="420" y="279" width="300" height="112" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="420" y="275" width="300" height="112" rx="16" fill="#ECE5FB" stroke="#D8CBEA"/><g transform="translate(438,292) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 6 9 10 9 10s9-4 9-10V6Z"/><path d="m8 12 3 3 5-6"/></g></g><text x="485" y="316" fill="#231B36" font-size="22.0" font-weight="700">AES-256-GCM</text><text x="439" y="343" fill="#70677D" font-size="18">Encrypt and authenticate</text><text x="439" y="367" fill="#70677D" font-size="18">Include associated data</text></g><g data-card="true" data-x="825" data-y="255" data-width="340" data-height="143"><rect x="825" y="259" width="340" height="143" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="825" y="255" width="340" height="143" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(843,272) scale(1.35)"><g fill="#7654C4"><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M17.193 9.555c-1.264-5.58-4.252-7.414-4.573-8.115-.28-.394-.53-.954-.735-1.44-.036.495-.055.685-.523 1.184-.723.566-4.438 3.682-4.74 10.02-.282 5.912 4.27 9.435 4.888 9.884l.07.05A73.49 73.49 0 0111.91 24h.481c.114-1.032.284-2.056.51-3.07.417-.296.604-.463.85-.693a11.342 11.342 0 003.639-8.464c.01-.814-.103-1.662-.197-2.218zm-5.336 8.195s0-8.291.275-8.29c.213 0 .49 10.695.49 10.695-.381-.045-.765-1.76-.765-2.405z" /></g></g><text x="890" y="296" fill="#231B36" font-size="22.0" font-weight="700">MongoDB ciphertext</text><text x="844" y="323" fill="#70677D" font-size="18">Key ID + nonce + ciphertext/tag</text><text x="844" y="347" fill="#70677D" font-size="18">No plaintext note or MFA key</text><text x="844" y="371" fill="#70677D" font-size="18">Shared nonce reservation index</text></g><g data-card="true" data-x="40" data-y="482" data-width="520" data-height="108"><rect x="40" y="486" width="520" height="108" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="40" y="482" width="520" height="108" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(58,499) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5-6 7 6 7M16 5l6 7-6 7M14 2l-4 20"/></g></g><text x="105" y="523" fill="#231B36" font-size="22.0" font-weight="700">Associated data</text><text x="59" y="550" fill="#70677D" font-size="18">purpose + user ID + deployment/position or enrollment</text><text x="59" y="574" fill="#70677D" font-size="18">Swapping account, record or purpose invalidates the tag.</text></g><g data-card="true" data-x="650" data-y="482" data-width="510" data-height="108"><rect x="650" y="486" width="510" height="108" rx="16" fill="#DDD4ED" opacity=".45"/><rect x="650" y="482" width="510" height="108" rx="16" fill="white" stroke="#D8CBEA"/><g transform="translate(668,499) scale(1.35)"><g fill="none" stroke="#7654C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m6 12 4 4 8-9"/></g></g><text x="715" y="523" fill="#231B36" font-size="22.0" font-weight="700">Read and verify</text><text x="669" y="550" fill="#70677D" font-size="18">Recheck account/linkage after chain reads</text><text x="669" y="574" fill="#70677D" font-size="18">Invalid tag or context: refuse decryption (409).</text></g></svg>