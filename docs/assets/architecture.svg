<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">HyperVaults architecture</title>
  <desc id="description">Separate sign-in, account and dashboard screens talk to FastAPI over REST. FastAPI verifies passwords, wallet proofs and optional MFA, encrypts notes and authenticator secrets, and stores account data in MongoDB. Browser wallets keep signing keys and send approved transactions to Sepolia or local Anvil. FastAPI reads the selected chain and verifies receipts. The HVT token and vault contracts hold the funded reward reserve.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#10121b"/><stop offset="1" stop-color="#0c0e14"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#b8a2ff" stroke-width="1.6"/></marker>
    <marker id="read-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#70d4b1" stroke-width="1.6"/></marker>
    <symbol id="browser" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18m-14-2.5h.01m3 0h.01"/></symbol>
    <symbol id="wallet" viewBox="0 0 24 24"><path d="M20 7V5H5a2 2 0 0 0 0 4h15v11H5a2 2 0 0 1-2-2V7"/><path d="M20 11h-5v5h5m-3-2.5h.01"/></symbol>
    <symbol id="server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01m4-11h6m-6 11h6"/></symbol>
    <symbol id="database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></symbol>
    <symbol id="token" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 7v10m8-10v10M8 12h8"/></symbol>
    <symbol id="vault" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="5"/><path d="M12 7v3m0 4v3m-5-5h3m4 0h3"/></symbol>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .heading{fill:#f3f2fa;font-size:26px;font-weight:650;letter-spacing:-.5px}
    .body{fill:#b1b1c4;font-size:21px}
    .eyebrow{fill:#85869e;font-size:16px;font-weight:600;letter-spacing:2px}
    .icon{fill:none;stroke:#c4b0ff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .card{fill:#171922;stroke:#303241;stroke-width:1.3}
    .line{fill:none;stroke:#b8a2ff;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <rect x="1" y="1" width="1438" height="758" rx="28" fill="url(#canvas)" stroke="#2b2e3d"/>
  <rect x="54" y="42" width="48" height="48" rx="14" fill="#b8a2ff"/>
  <use href="#vault" x="65" y="53" width="26" height="26" class="icon" style="stroke:#29213f"/>
  <text x="121" y="75" fill="#f3f2fa" font-size="34" font-weight="650" letter-spacing="-1">A small stack. Clear responsibilities.</text>
  <rect x="1193" y="48" width="193" height="36" rx="18" fill="#172720" stroke="#284437"/>
  <circle cx="1214" cy="66" r="4" fill="#70d4b1"/>
  <text x="1228" y="72" fill="#9be0c7" font-size="17">Sepolia &amp; Anvil</text>
  <text x="54" y="148" class="eyebrow">USER DEVICE</text>
  <text x="555" y="148" class="eyebrow">LOCAL APPLICATION</text>
  <text x="1056" y="148" class="eyebrow">DATABASE</text>
  <rect x="54" y="176" width="342" height="172" rx="20" class="card"/>
  <rect x="80" y="204" width="46" height="46" rx="13" fill="#282238"/>
  <use href="#browser" x="91" y="215" width="24" height="24" class="icon"/>
  <text x="144" y="235" class="heading">Browser interface</text>
  <text x="80" y="284" class="body">HTML · CSS · JavaScript</text>
  <text x="80" y="315" class="body">Auth &amp; account · Dashboard</text>
  <rect x="555" y="176" width="342" height="172" rx="20" class="card"/>
  <rect x="581" y="204" width="46" height="46" rx="13" fill="#282238"/>
  <use href="#server" x="592" y="215" width="24" height="24" class="icon"/>
  <text x="645" y="235" class="heading">FastAPI</text>
  <text x="581" y="284" class="body">Argon2id · SIWE · MFA</text>
  <text x="581" y="315" class="body">AES-GCM notes &amp; MFA secrets</text>
  <rect x="1056" y="176" width="330" height="172" rx="20" class="card"/>
  <rect x="1082" y="204" width="46" height="46" rx="13" fill="#1d302a"/>
  <use href="#database" x="1093" y="215" width="24" height="24" class="icon" style="stroke:#70d4b1"/>
  <text x="1146" y="235" class="heading">MongoDB</text>
  <text x="1082" y="284" class="body">Users · sessions · MFA · index</text>
  <text x="1082" y="315" class="body">Ciphertext &amp; recovery hashes</text>
  <path d="M402 262h146" class="line" marker-start="url(#arrow)"/>
  <text x="475" y="244" fill="#c4b0ff" font-size="17" text-anchor="middle">REST + cookies</text>
  <path d="M903 262h146" class="line" marker-start="url(#arrow)"/>
  <text x="976" y="244" fill="#c4b0ff" font-size="17" text-anchor="middle">Account data</text>
  <path d="M225 355v92" class="line" marker-start="url(#arrow)"/>
  <text x="246" y="405" fill="#c4b0ff" font-size="18">Connect &amp; sign</text>
  <rect x="54" y="454" width="342" height="190" rx="20" fill="#1a1825" stroke="#54456f" stroke-width="1.3"/>
  <rect x="80" y="482" width="46" height="46" rx="13" fill="#302641"/>
  <use href="#wallet" x="91" y="493" width="24" height="24" class="icon"/>
  <text x="144" y="513" class="heading">Browser wallet</text>
  <text x="80" y="566" class="body">EOA signatures &amp; transactions</text>
  <text x="80" y="603" fill="#c4b0ff" font-size="21" font-weight="550">Private keys stay here</text>
  <path d="M726 355v58" fill="none" stroke="#70d4b1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#read-arrow)"/>
  <text x="749" y="389" fill="#8fd9bf" font-size="18">Reads &amp; receipt checks</text>
  <path d="M403 550h144" class="line"/>
  <text x="475" y="532" fill="#c4b0ff" font-size="17" text-anchor="middle">Sign &amp; send</text>
  <rect x="555" y="420" width="831" height="224" rx="20" fill="#131d1b" stroke="#2d443b" stroke-width="1.3"/>
  <circle cx="585" cy="452" r="5" fill="#70d4b1"/>
  <text x="603" y="460" fill="#a8e8d0" font-size="22" font-weight="600">Sepolia 11155111 / Anvil 31337</text>
  <text x="1362" y="458" fill="#769e8f" font-size="17" text-anchor="end">Solidity contracts</text>
  <rect x="579" y="483" width="342" height="137" rx="14" class="card"/>
  <use href="#token" x="600" y="504" width="26" height="26" class="icon"/>
  <text x="640" y="526" class="heading">HVT token</text>
  <text x="600" y="564" class="body">ERC-20 test token</text>
  <text x="600" y="596" class="body">Faucet &amp; exact approvals</text>
  <rect x="945" y="483" width="417" height="137" rx="14" class="card"/>
  <use href="#vault" x="966" y="504" width="26" height="26" class="icon"/>
  <text x="1006" y="526" class="heading">Vault contract</text>
  <text x="966" y="564" class="body">Positions · locks · withdrawals</text>
  <text x="966" y="596" class="body">Sponsor-funded reward reserve</text>
  <path d="M54 681h1332" stroke="#2b2e3d"/>
  <text x="54" y="721" fill="#b1b1c4" font-size="20">Wallets sign. The server verifies. Rewards come from a prefunded reserve.</text>
  <text x="1386" y="721" fill="#85869e" font-size="17" text-anchor="end">HYPERVAULTS</text>
</svg>
