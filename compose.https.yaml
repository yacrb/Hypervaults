services:
  app:
    ports: !override
      - "127.0.0.1:8443:8088"
    command: ["/app/.venv/bin/uvicorn", "webapp.main:app", "--host", "0.0.0.0", "--port", "8088", "--no-access-log", "--no-proxy-headers", "--ssl-keyfile", "/app/.local/tls/server.key", "--ssl-certfile", "/app/.local/tls/server.crt"]
